name: Audit and regression tests
on:
  push:
    branches: [audit-fixes-2026-11-22]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/worker.js
          node --check public/app.js
          node --check tests/audit-regressions.mjs
      - name: Run tests
        run: npm test
      - name: Release preflight
        run: npm run preflight

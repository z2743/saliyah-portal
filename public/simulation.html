<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرصد المملكة العربية الصالية</title><style>body{margin:0;background:#091528;color:#e8f0fa;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{color:#d9bb78}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#203c62;color:#fff;border:1px solid #53709a;border-radius:10px;padding:11px;cursor:pointer}button:hover{background:#355984}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card,section{background:#14263f;border:1px solid #30445e;border-radius:14px;padding:16px;margin:12px 0}.num{font-size:26px;font-weight:bold;color:#d9bb78}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #30445e}small{color:#adc1d6}.error{color:#ffb7b7}a{color:#d9bb78}</style></head><body><main><h1>👑 مرصد المملكة العربية الصالية</h1><p>لوحة متابعة المحاكاة الآلية — جميع الأحداث والشخصيات المعروضة افتراضية.</p><nav><button onclick="load('overview')">نظرة عامة</button><button onclick="load('citizens')">ملف المواطنين الآليين 👥</button><button onclick="load('banking')">الحسابات البنكية 💳</button><button onclick="load('diagnostics')">تشخيص التشغيل 🛠️</button><button onclick="runSimulation()">تشغيل دورة محاكاة الآن 👑</button><button onclick="load('security')">الشرطة والمحاكم والمنافذ</button><button onclick="load('economy')">العقارات والأسهم والحياة</button><button onclick="load('identities')">هويات المواطنين 👑</button><button onclick="load('approvals')">اعتمادات الملك</button><a href="/">العودة للبوابة</a></nav><div id="view">جارٍ التحميل...</div></main><script>
const el=document.getElementById('view');const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,opt){let r=await fetch('/api'+p,{credentials:'same-origin',...opt});let d;try{d=await r.json()}catch{throw Error('استجابة غير صالحة من الخادم (HTTP '+r.status+')')}if(!r.ok)throw Error((d.error||'تعذر الاتصال')+(d.detail?' — '+d.detail:'')+' (HTTP '+r.status+')');return d}
function table(title,rows,cols){return '<section><h2>'+esc(title)+'</h2><div class="tablewrap"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+(rows||[]).map(row=>'<tr>'+cols.map(x=>'<td>'+esc(row[x[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(!rows?.length?'<small>لا توجد سجلات بعد</small>':'')+'</section>'}
function cards(arr){return '<div class="cards">'+arr.map(x=>'<div class="card"><small>'+esc(x[0])+'</small><div class="num">'+esc(x[1])+'</div></div>').join('')+'</div>'}
async function load(tab){el.textContent='جارٍ التحميل...';try{if(tab==='identities'){const d=await api('/civil/intake');const rows=d.bot_identity_applications||[];el.innerHTML=table('حالات هويات المواطنين الآليين',d.bot_identity_counts||[],[['status','الحالة'],['n','العدد']])+'<section><h2>طلبات الهوية للملك</h2><p><button id="bulkapprove">اعتماد 20 طلبًا</button> <button id="bulkreject">رفض 10 طلبات</button></p>'+rows.filter(x=>x.status==='requested').map(x=>'<div class="card"><b>'+esc(x.name||x.citizen||x.citizen_id)+'</b> <small>'+esc(x.id)+'</small><p><button data-bot-id="'+esc(x.id)+'" data-bot-decision="approved">اعتماد</button> <button data-bot-id="'+esc(x.id)+'" data-bot-decision="rejected">رفض</button></p></div>').join('')+'</section>';const decide=async payload=>{try{const result=await api('/civil/bot-identities/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});alert('تم تحديث '+result.changed+' طلب');load('identities')}catch(e){alert(e.message)}};el.querySelector('#bulkapprove').onclick=()=>{if(confirm('اعتماد 20 طلبًا معلقًا؟'))decide({bulk:true,limit:20,decision:'approved'})};el.querySelector('#bulkreject').onclick=()=>{if(confirm('رفض 10 طلبات غير مكتملة؟'))decide({bulk:true,limit:10,decision:'rejected',note:'عدم استيفاء متطلبات الهوية في المحاكاة'})};el.querySelectorAll('[data-bot-decision]').forEach(b=>b.onclick=()=>{const rejected=b.dataset.botDecision==='rejected';const note=rejected?prompt('سبب الرفض:','بيانات غير مكتملة'):'';if(rejected&&!note)return;decide({id:b.dataset.botId,decision:b.dataset.botDecision,note})});}
else if(tab==='banking'){const d=await api('/admin/simulation/banking?type='+encodeURIComponent(window.bankType||'all')+'&q='+encodeURIComponent(window.bankQuery||''));el.innerHTML='<section><h2>الحسابات البنكية للمواطنين والشركات</h2><p>الأرصدة افتراضية بالهلل الصالي ومنفصلة عن البنوك الحقيقية.</p><select id="bankType"><option value="all">الكل</option><option value="citizen">المواطنون</option><option value="company">الشركات</option></select> <input id="bankQuery" placeholder="بحث بالاسم أو رقم الحساب"> <button id="bankSearch">بحث</button></section>'+table('إجمالي الحسابات',d.totals,[['owner_type','النوع'],['accounts','عدد الحسابات'],['balance','إجمالي الأرصدة']])+table('الحسابات وأرقامها (أول 150 نتيجة)',d.accounts,[['owner_name','صاحب الحساب'],['owner_type','النوع'],['account_number','رقم الحساب'],['bank_name','البنك'],['balance','الرصيد (ريال صالي)'],['status','الحالة']])+table('آخر 100 حركة مالية',d.transactions,[['owner_name','صاحب الحساب'],['account_number','رقم الحساب'],['kind','نوع الحركة'],['amount','المبلغ'],['description','التفاصيل'],['created_at','التاريخ']]);el.innerHTML+='<section><h2>قرارات مديري الشركات الآليين</h2><p>المدير الآلي يختار دورية الراتب تلقائيًا ويُراجعها كل أربعة أسابيع.</p>'+d.companies.map(c=>'<p>'+esc(c.name)+' — '+(c.payroll_weeks===2?'كل أسبوعين':'كل أسبوع')+'</p>').join('')+'</section>';el.querySelector('#bankType').value=window.bankType||'all';el.querySelector('#bankQuery').value=window.bankQuery||'';el.querySelector('#bankSearch').onclick=()=>{window.bankType=el.querySelector('#bankType').value;window.bankQuery=el.querySelector('#bankQuery').value.trim();load('banking')};}
else if(tab==='citizens'){const d=await api('/admin/simulation/citizens');el.innerHTML=cards([['المواطنون',d.citizens],['المنشورات',d.x_posts],['حسابات إكس',d.x_profiles],['الطلاب',d.enrollments],['الزيجات',d.marriages],['الأبناء',d.children]])+table('الهويات حسب الحالة',d.identities,[['status','الحالة'],['n','العدد']])+table('الشركات',d.companies,[['name','الاسم'],['activity','النشاط'],['status','الحالة'],['founder_id','المؤسس']])+table('الوظائف',d.jobs,[['company','الشركة'],['title','الوظيفة'],['status','الحالة']])+table('طلبات التوظيف',d.applications,[['citizen','المواطن'],['job','الوظيفة'],['status','الحالة'],['created_at','التاريخ']])+table('أحداث حياة المواطنين',d.events,[['citizen_id','المواطن'],['event_type','الحدث'],['description','التفاصيل'],['created_at','التاريخ']])+table('طلبات المشاريع',d.projects,[['status','الحالة'],['n','العدد']])+table('سجلات التشغيل',Object.entries(d.diagnostics).map(([key,value])=>({key,value})),[['key','المؤشر'],['value','القيمة']]);}
else if(tab==='diagnostics'){const d=await api('/simulation/diagnostics');const entries=Object.entries(d.diagnostics||{});el.innerHTML='<section><h2>سجل تشغيل البوتات</h2><p>آخر نجاح أو خطأ في تشغيل المحاكاة الحكومية وإكس الصالية. يحدث عند كل دورة مجدولة.</p>'+(entries.length?table('التشخيص',entries.map(([key,value])=>({key,value})),[['key','المؤشر'],['value','القيمة']]):'<p>ما فيه تشغيل مسجل بعد. انتظر موعد الدورة التالية.</p>')+'</section>';}
else if(tab==='overview'){const d=await api('/simulation/status');el.innerHTML=cards([['المواطنون الافتراضيون',d.simulated_citizens],['الوزارات الآلية',d.automated_ministries],['الوظائف',d.simulated_jobs],['طلبات المشاريع',d.projects?.reduce((n,x)=>n+x.n,0)],['الشركات',d.companies?.reduce((n,x)=>n+x.n,0)]])+table('حالة المشاريع',d.projects||[],[['status','الحالة'],['n','العدد']])+table('حالة الشركات',d.companies||[],[['status','الحالة'],['n','العدد']]);}
else if(tab==='security'){const d=await api('/simulation/security');el.innerHTML=table('حركة المنافذ',d.border_events,[['citizen','المواطن'],['port','المنفذ'],['direction','الحركة'],['created_at','الوقت']])+table('الشرطة',d.police_incidents,[['suspect','المشتبه به'],['officer','العسكري'],['allegation','الواقعة'],['status','الحالة']])+table('المحاكم',d.trials,[['judge','القاضي'],['allegation','القضية'],['verdict','القرار'],['status','الحالة']]);}
else if(tab==='economy'){const d=await api('/simulation/economy');el.innerHTML=table('العقارات',d.properties,[['kind','النوع'],['location','الموقع'],['price','السعر'],['status','الحالة']])+table('تداولات الأسهم',d.share_trades,[['company_name','الشركة'],['units','الأسهم'],['price_per_unit','سعر الوحدة'],['created_at','التاريخ']])+table('الزواج',d.marriages,[['partner_a_name','الطرف الأول'],['partner_b_name','الطرف الثاني'],['status','الحالة']])+table('أحداث الحياة',d.life_events,[['citizen_name','المواطن'],['kind','الحدث'],['description','التفاصيل']]);}
else{const [p,c]=await Promise.all([api('/admin/simulation/projects'),api('/admin/simulation/companies')]);const approvals=(title,items,type)=>'<section><h2>'+title+'</h2>'+(items||[]).filter(x=>x.status==='pending_human').map(x=>'<div class="card"><b>'+esc(x.title||x.name)+'</b><p>'+esc(x.description)+'</p><small>التكلفة أو رأس المال: '+esc(x.budget??x.capital)+'</small><p><button data-id="'+esc(x.id)+'" data-type="'+type+'" data-decision="approved">اعتماد</button> <button data-id="'+esc(x.id)+'" data-type="'+type+'" data-decision="rejected">رفض</button></p></div>').join('')+'</section>';el.innerHTML=approvals('المشاريع',p.projects,'projects')+approvals('الشركات',c.companies,'companies');el.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{if(!confirm('تأكيد القرار؟'))return;try{await api('/admin/simulation/'+b.dataset.type+'/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,decision:b.dataset.decision})});load('approvals')}catch(e){alert(e.message)}});}
}catch(e){el.innerHTML='<p class="error">'+esc(e.message)+'</p><small>قد تحتاج لتسجيل الدخول بحساب الملك أو نشر أحدث نسخة من الكود.</small>'}}async function runSimulation(){if(!confirm('تشغيل دورة المحاكاة الآن؟ متاح مرة واحدة كل ساعة.'))return;const btn=document.querySelector('button[onclick="runSimulation()"]');btn.disabled=true;btn.textContent='جارٍ تشغيل المحاكاة...';el.innerHTML='<section>⏳ جارٍ تنفيذ دورة المحاكاة، انتظر النتيجة...</section>';try{const d=await api('/admin/simulation/run',{method:'POST'});el.innerHTML='<section>✅ تم تنفيذ دورة المحاكاة بنجاح. جارٍ تحديث الأرقام...</section>';await load('overview')}catch(e){el.innerHTML='<section class="error"><h2>تعذر تشغيل المحاكاة</h2><p>'+esc(e.message)+'</p><small>انسخ الخطأ وأرسله للفحص. إذا ظهر 403 فتأكد من دخولك بحساب الملك.</small></section>'}finally{btn.disabled=false;btn.textContent='تشغيل دورة محاكاة الآن 👑'}}load('overview');
</script></body></html>

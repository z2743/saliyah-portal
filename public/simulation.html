<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرصد المملكة العربية الصالية</title><style>body{margin:0;background:#091528;color:#e8f0fa;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{color:#d9bb78}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#203c62;color:#fff;border:1px solid #53709a;border-radius:10px;padding:11px;cursor:pointer}button:hover{background:#355984}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card,section{background:#14263f;border:1px solid #30445e;border-radius:14px;padding:16px;margin:12px 0}.num{font-size:26px;font-weight:bold;color:#d9bb78}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:10px;border-bottom:1px solid #30445e}small{color:#adc1d6}.error{color:#ffb7b7}a{color:#d9bb78}</style></head><body><main><h1>👑 مرصد المملكة العربية الصالية</h1><p>لوحة متابعة المحاكاة الآلية — جميع الأحداث والشخصيات المعروضة افتراضية.</p><nav><button onclick="load('overview')">نظرة عامة</button><button onclick="load('security')">الشرطة والمحاكم والمنافذ</button><button onclick="load('economy')">العقارات والأسهم والحياة</button><button onclick="load('approvals')">اعتمادات الملك</button><a href="/">العودة للبوابة</a></nav><div id="view">جارٍ التحميل...</div></main><script>
const el=document.getElementById('view');const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,opt){let r=await fetch('/api'+p,{credentials:'same-origin',...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'تعذر الاتصال');return d}
function table(title,rows,cols){return '<section><h2>'+esc(title)+'</h2><div class="tablewrap"><table><thead><tr>'+cols.map(x=>'<th>'+esc(x[1])+'</th>').join('')+'</tr></thead><tbody>'+(rows||[]).map(row=>'<tr>'+cols.map(x=>'<td>'+esc(row[x[0]])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'+(!rows?.length?'<small>لا توجد سجلات بعد</small>':'')+'</section>'}
function cards(arr){return '<div class="cards">'+arr.map(x=>'<div class="card"><small>'+esc(x[0])+'</small><div class="num">'+esc(x[1])+'</div></div>').join('')+'</div>'}
async function load(tab){el.textContent='جارٍ التحميل...';try{if(tab==='overview'){const d=await api('/simulation/status');el.innerHTML=cards([['المواطنون الافتراضيون',d.simulated_citizens],['الوزارات الآلية',d.automated_ministries],['الوظائف',d.simulated_jobs],['طلبات المشاريع',d.projects?.reduce((n,x)=>n+x.n,0)],['الشركات',d.companies?.reduce((n,x)=>n+x.n,0)]])+table('حالة المشاريع',d.projects||[],[['status','الحالة'],['n','العدد']])+table('حالة الشركات',d.companies||[],[['status','الحالة'],['n','العدد']]);}
else if(tab==='security'){const d=await api('/simulation/security');el.innerHTML=table('حركة المنافذ',d.border_events,[['citizen','المواطن'],['port','المنفذ'],['direction','الحركة'],['created_at','الوقت']])+table('الشرطة',d.police_incidents,[['suspect','المشتبه به'],['officer','العسكري'],['allegation','الواقعة'],['status','الحالة']])+table('المحاكم',d.trials,[['judge','القاضي'],['allegation','القضية'],['verdict','القرار'],['status','الحالة']]);}
else if(tab==='economy'){const d=await api('/simulation/economy');el.innerHTML=table('العقارات',d.properties,[['kind','النوع'],['location','الموقع'],['price','السعر'],['status','الحالة']])+table('تداولات الأسهم',d.share_trades,[['company_id','الشركة'],['units','الأسهم'],['price_per_unit','سعر الوحدة'],['created_at','التاريخ']])+table('الزواج',d.marriages,[['partner_a','الطرف الأول'],['partner_b','الطرف الثاني'],['status','الحالة']])+table('أحداث الحياة',d.life_events,[['citizen_id','المواطن'],['kind','الحدث'],['description','التفاصيل']]);}
else{const [p,c]=await Promise.all([api('/admin/simulation/projects'),api('/admin/simulation/companies')]);const approvals=(title,items,type)=>'<section><h2>'+title+'</h2>'+(items||[]).filter(x=>x.status==='pending_human').map(x=>'<div class="card"><b>'+esc(x.title||x.name)+'</b><p>'+esc(x.description)+'</p><small>التكلفة أو رأس المال: '+esc(x.budget??x.capital)+'</small><p><button data-id="'+esc(x.id)+'" data-type="'+type+'" data-decision="approved">اعتماد</button> <button data-id="'+esc(x.id)+'" data-type="'+type+'" data-decision="rejected">رفض</button></p></div>').join('')+'</section>';el.innerHTML=approvals('المشاريع',p.projects,'projects')+approvals('الشركات',c.companies,'companies');el.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{if(!confirm('تأكيد القرار؟'))return;try{await api('/admin/simulation/'+b.dataset.type+'/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:b.dataset.id,decision:b.dataset.decision})});load('approvals')}catch(e){alert(e.message)}});}
}catch(e){el.innerHTML='<p class="error">'+esc(e.message)+'</p><small>قد تحتاج لتسجيل الدخول بحساب الملك أو نشر أحدث نسخة من الكود.</small>'}}load('overview');
</script></body></html>
